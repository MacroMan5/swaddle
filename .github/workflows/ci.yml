name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Self-hosted Windows runner (swaddle-win) — no GitHub-hosted minutes left.
    # `--with-deps` is Linux-only: on Windows, install chromium without it.
    runs-on: [self-hosted, Windows]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # --ignore-scripts: `npm ci` would otherwise run better-sqlite3's default
      # `node-gyp rebuild`, which needs a Visual Studio toolchain the runner's
      # service account cannot discover. The package ships N-API prebuilds, so
      # no compilation is needed (fsevents, the only other install script, is
      # macOS-only and optional).
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run test:unit
      - run: npx playwright install chromium
      - run: npm run test:e2e
      - run: docker build -t swaddle:ci .
