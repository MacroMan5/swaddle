# Construit et publie l'image multi-arch sur GHCR à chaque tag vX.Y.Z (ADR 0002).
# Ne se déclenche que sur les tags : inoffensif tant que le Dockerfile n'existe pas.
name: release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    # Runner auto-hébergé Windows (swaddle-win) : Docker Desktop/WSL2 fournit
    # déjà l'émulation arm64 — pas de setup-qemu-action (Linux seulement).
    runs-on: [self-hosted, Windows]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          # Keep the `v` prefix from the git tag (v0.1.0 -> v0.1.0, not 0.1.0):
          # deploy/docker-compose.yml and the README both pull `:vX.Y.Z`.
          tags: |
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
