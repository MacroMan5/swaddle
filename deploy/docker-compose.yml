# Déploiement de référence (ADR 0002) — copiez ce fichier sur votre serveur.
# Mise à jour volontaire : changez le tag de l'image puis `docker compose pull && up -d`.
services:
  swaddle:
    # Remplacez le tag par la dernière version publiée (jamais :latest).
    image: ghcr.io/macroman5/swaddle:v0.1.0
    container_name: swaddle
    restart: unless-stopped
    ports:
      - "${SWADDLE_PORT:-3010}:3000"
    volumes:
      - ./data:/app/data
    environment:
      - TZ=${TZ:-America/Toronto}
    labels:
      # Les mises à jour de cette app (données du bébé + migrations SQLite)
      # restent manuelles.
      - com.centurylinklabs.watchtower.enable=false
