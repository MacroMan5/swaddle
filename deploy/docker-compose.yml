# Déploiement de référence (ADR 0002) — copiez ce fichier sur votre serveur.
# Mise à jour volontaire : changez SWADDLE_IMAGE dans .env puis lancez pull et up -d.
services:
  swaddle:
    # Utilisez toujours une version publiée, jamais :latest.
    image: "${SWADDLE_IMAGE:-ghcr.io/macroman5/swaddle:v0.1.0}"
    container_name: swaddle
    restart: unless-stopped
    ports:
      - "${SWADDLE_PORT:-3010}:3000"
    volumes:
      # Le conteneur tourne en uid/gid 1000 (non root) : ce dossier doit
      # appartenir à 1000:1000 sur l'hôte avant le premier démarrage — voir
      # README.md.
      - "${SWADDLE_DATA_DIR:-./data}:/app/data"
    environment:
      - "TZ=${TZ:-UTC}"
      # Taille maximale d'une requête (restauration d'un export JSON) — voir
      # README.md. Doit rester égale à la limite applicative (10 Mo).
      - "BODY_SIZE_LIMIT=${SWADDLE_BODY_SIZE_LIMIT:-10M}"
      # URL utilisée par les navigateurs pour joindre l'app — voir README.md.
      # Sans elle, adapter-node suppose https et le cookie de session PIN est
      # marqué Secure, ce qu'un navigateur refuse d'envoyer en clair (issue #69).
      # Pas de valeur publique par défaut : requise, sinon échec au démarrage.
      - "ORIGIN=${SWADDLE_ORIGIN:?Définissez SWADDLE_ORIGIN dans .env (voir README.md)}"
    labels:
      # Les mises à jour de cette app (données du bébé + migrations SQLite)
      # restent manuelles.
      - com.centurylinklabs.watchtower.enable=false
